<!DOCTYPE html>
<html lang="en">
<head>

            <div class="social-wrapper">
                <img src="insta.png" class="img-insta" alt="Instagram">
                <img src="x.png" class="img-x" alt="Twitter">
            </div>

            <div class="contact-footer">
                <img src="cdlogo.png" class="cd-outline-bottom glow" alt="Coach Designs">
